<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revenue Recovery — RL-USERS</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:#0F0F0F; color:#E5E7EB; font-family: system-ui, -apple-system, sans-serif; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-6px);} to { opacity:1; transform:none; } }
    @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .row-in { animation: fadeIn .3s ease; }
    .dot { animation: pulse 1.3s ease-in-out infinite; }
    @keyframes sweep { 0%{margin-left:-35%} 100%{margin-left:100%} }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background:#2A2A2A; border-radius:4px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const S = {
  bg:'#0F0F0F', card:'#161616', border:'#262626', dim:'#8B8B8B',
  green:'#34D399', red:'#F87171', blue:'#60A5FA', amber:'#FBBF24', purple:'#A78BFA',
};
const card = (extra={}) => ({
  background:S.card, border:`1px solid ${S.border}`, borderRadius:12,
  padding:20, ...extra,
});
const mono = { fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace' };
const pct = (v, d=2) => `${(v*100).toFixed(d)}%`;
const money = (v) => v == null ? '—' : v.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});

/* ─── header ─── */
const Header = ({ live }) => (
  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                marginBottom:24, flexWrap:'wrap', gap:12 }}>
    <div>
      <h1 style={{ fontSize:'1.5rem', fontWeight:700, letterSpacing:'-0.02em' }}>
        Revenue Recovery
      </h1>
      <p style={{ color:S.dim, fontSize:'0.82rem', marginTop:4 }}>
        Detect at-risk checkouts · intervene once · measure the difference · log every decision
      </p>
    </div>
    <div style={{ display:'flex', alignItems:'center', gap:8, ...mono, fontSize:'0.76rem' }}>
      <span className={live ? 'dot' : ''} style={{
        width:8, height:8, borderRadius:'50%',
        background: live ? S.green : S.dim, display:'inline-block' }} />
      {live ? 'LIVE SIMULATION' : 'connecting…'}
    </div>
  </div>
);

/* ─── the headline result ─── */
const Result = ({ ab, aa, rob }) => {
  /* The pooled multi-seed figure is the headline. A single experiment overstates
     it -- seed 42 came in at +2.82% against a pooled +1.57% -- so when the
     pooled result is available the page shows that and labels the single run as
     one draw. */
  if (rob?.ab?.pooled) return <PooledResult rob={rob} />;
  if (!ab?.found) return (
    <div style={card()}>
      <p style={{ color:S.dim }}>No experiment in the audit trail yet. Run
        <code style={{ ...mono, color:S.blue }}> python -m sim.experiment </code>
        to populate it.</p>
    </div>
  );
  const r = ab.result, m = ab.margin;
  const sig = r.significant;
  return (
    <div style={card()}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
        <h3 style={{ fontSize:'1rem' }}>Did the intervention work?</h3>
        <span style={{ ...mono, fontSize:'0.7rem', color:S.dim }}>{ab.experiment_id}</span>
      </div>

      <div style={{ display:'flex', gap:28, marginTop:18, flexWrap:'wrap' }}>
        <Stat label="treatment" value={pct(r.treat_rate)} sub={`n=${r.treat_n}`} color={S.green} big />
        <Stat label="control"   value={pct(r.control_rate)} sub={`n=${r.control_n}`} color={S.dim} big />
        <Stat label="difference" value={`${r.delta >= 0 ? '+' : ''}${pct(r.delta)}`}
              sub={`95% CI ${pct(r.ci_low)} → ${pct(r.ci_high)}`}
              color={sig ? S.green : S.amber} big />
      </div>

      {/* CI bar */}
      <CIBar low={r.ci_low} high={r.ci_high} delta={r.delta} />

      <div style={{ display:'flex', gap:10, marginTop:16, flexWrap:'wrap' }}>
        <Badge ok={sig} text={sig ? `SIGNIFICANT  z=${r.z}` : `not significant  z=${r.z}`} />
        <Badge ok={null} text={`MDE ${pct(r.mde)}`} />
        {aa?.found && (
          <Badge ok={!aa.result.significant}
                 text={`A/A null  ${aa.result.delta >= 0 ? '+' : ''}${pct(aa.result.delta)}  z=${aa.result.z}`} />
        )}
      </div>

      <p style={{ color:S.dim, fontSize:'0.76rem', marginTop:14, lineHeight:1.6 }}>
        The <strong style={{color:S.purple}}>A/A check</strong> runs the same detector, the same
        arm assignment and the same scheduling with <em>nothing applied</em>. It must come back
        null — that is what separates a measurement from an artefact of the machinery.
      </p>
    </div>
  );
};

const PooledResult = ({ rob }) => {
  const ab = rob.ab, aa = rob.aa;
  const p = ab.pooled, a = aa.pooled;
  const boot = ab.bootstrap_ci || [];
  return (
    <div style={card()}>
      <div style={{ display:'flex', justifyContent:'space-between',
                    alignItems:'baseline', flexWrap:'wrap', gap:8 }}>
        <h3 style={{ fontSize:'1rem' }}>Did the intervention work?</h3>
        <span style={{ ...mono, fontSize:'0.7rem', color:S.dim }}>
          pooled over {ab.seeds} seeds &middot; {rob.sessions_per_seed?.toLocaleString?.() || ''} sessions each
        </span>
      </div>

      <div style={{ display:'flex', gap:28, marginTop:18, flexWrap:'wrap' }}>
        <Stat label="treatment" value={pct(p.treat_rate)} sub={`n=${p.treat_n}`}
              color={S.green} big />
        <Stat label="control" value={pct(p.control_rate)} sub={`n=${p.control_n}`}
              color={S.dim} big />
        <Stat label="difference"
              value={`${p.delta >= 0 ? '+' : ''}${pct(p.delta)}`}
              sub={`95% CI ${pct(p.ci_low)} → ${pct(p.ci_high)}`}
              color={p.significant ? S.green : S.amber} big />
      </div>

      <CIBar low={p.ci_low} high={p.ci_high} delta={p.delta} />

      <div style={{ display:'flex', gap:10, marginTop:16, flexWrap:'wrap' }}>
        <Badge ok={p.significant}
               text={p.significant ? `SIGNIFICANT  z=${p.z}` : `not significant  z=${p.z}`} />
        <Badge ok={!a.significant}
               text={`A/A null  ${a.delta >= 0 ? '+' : ''}${pct(a.delta)}  z=${a.z}`} />
        <Badge ok={null} text={`${ab.seeds_positive} of ${ab.seeds} seeds positive`} />
        {boot.length === 2 && (
          <Badge ok={null}
                 text={`bootstrap ${pct(boot[0])} → ${pct(boot[1])}`} />
        )}
      </div>

      <p style={{ color:S.dim, fontSize:'0.76rem', marginTop:14, lineHeight:1.6 }}>
        Pooled across seeds on purpose. A single 5,000-session run carries a
        standard deviation near 1.7 points, so one run measures the seed as much
        as the effect — four earlier claims in this project were withdrawn for
        exactly that reason. The <strong style={{color:S.purple}}>A/A check</strong>
        runs the same machinery with nothing applied and must come back null;
        {' '}{aa.seeds_positive} of {aa.seeds} seeds came out positive, which is
        the coin-flip you want from noise.
      </p>
    </div>
  );
};

const CIBar = ({ low, high, delta }) => {
  const span = Math.max(Math.abs(low), Math.abs(high)) * 1.35 || 0.05;
  const x = v => ((v + span) / (2*span)) * 100;
  const crossesZero = low < 0 && high > 0;
  return (
    <div style={{ marginTop:20 }}>
      <div style={{ position:'relative', height:34 }}>
        <div style={{ position:'absolute', top:15, left:0, right:0, height:2, background:S.border }} />
        <div style={{ position:'absolute', top:6, left:`${x(0)}%`, width:1, height:20,
                      background:S.dim, opacity:0.8 }} />
        <div style={{ position:'absolute', top:12, left:`${x(low)}%`, width:`${x(high)-x(low)}%`,
                      height:8, borderRadius:4,
                      background: crossesZero ? S.amber : S.green, opacity:0.35 }} />
        <div style={{ position:'absolute', top:8, left:`${x(delta)}%`, width:3, height:16,
                      background: crossesZero ? S.amber : S.green, borderRadius:2 }} />
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', ...mono,
                    fontSize:'0.68rem', color:S.dim }}>
        <span>{pct(-span,1)}</span>
        <span>0 = no effect</span>
        <span>+{pct(span,1)}</span>
      </div>
    </div>
  );
};

const Stat = ({ label, value, sub, color, big }) => (
  <div>
    <div style={{ color:S.dim, fontSize:'0.72rem', textTransform:'uppercase',
                  letterSpacing:'0.06em' }}>{label}</div>
    <div style={{ ...mono, fontSize: big ? '1.9rem' : '1.2rem', color, fontWeight:600,
                  lineHeight:1.25 }}>{value}</div>
    {sub && <div style={{ ...mono, color:S.dim, fontSize:'0.7rem' }}>{sub}</div>}
  </div>
);

const Badge = ({ ok, text }) => {
  const c = ok === null ? S.dim : ok ? S.green : S.amber;
  return <span style={{ ...mono, fontSize:'0.7rem', color:c, border:`1px solid ${c}44`,
                        background:`${c}14`, padding:'4px 10px', borderRadius:20 }}>{text}</span>;
};

/* ─── margin ─── */
const Margin = ({ ab }) => {
  if (!ab?.found) return null;
  const m = ab.margin;
  const max = Math.max(m.gross_recovered, m.discount_cost, 1);
  const bar = (v, color) => (
    <div style={{ background:S.border, borderRadius:4, height:9, overflow:'hidden' }}>
      <div style={{ width:`${Math.min(100, (Math.abs(v)/max)*100)}%`, height:'100%',
                    background:color, borderRadius:4 }} />
    </div>
  );
  return (
    <div style={card()}>
      <h3 style={{ fontSize:'1rem' }}>Net margin, not recovered revenue</h3>
      <p style={{ color:S.dim, fontSize:'0.76rem', marginTop:6, marginBottom:18, lineHeight:1.6 }}>
        The discount is billed on <em>every</em> treated conversion — including shoppers who
        would have bought anyway. Gross recovered revenue counts the upside and ignores the bill.
      </p>
      {[['gross recovered', m.gross_recovered, S.green],
        ['discount cost',   m.discount_cost,   S.red]].map(([l,v,c]) => (
        <div key={l} style={{ marginBottom:14 }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:5,
                        fontSize:'0.82rem' }}>
            <span>{l}</span><span style={{ ...mono, color:c }}>{money(v)}</span>
          </div>
          {bar(v, c)}
        </div>
      ))}
      <div style={{ borderTop:`1px solid ${S.border}`, marginTop:16, paddingTop:14,
                    display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
        <span style={{ fontSize:'0.9rem' }}>net</span>
        <span style={{ ...mono, fontSize:'1.4rem', fontWeight:600,
                       color: m.margin_positive ? S.green : S.red }}>
          {m.margin_positive ? '+' : ''}{money(m.net)}
        </span>
      </div>
      <p style={{ color:S.dim, fontSize:'0.72rem', marginTop:10 }}>
        Synthetic order values — illustrative, not a revenue forecast.
      </p>
    </div>
  );
};

/* ─── drivers ─── */
const Drivers = ({ d }) => {
  if (!d?.found) return null;
  const colors = { price:S.green, hesitation:S.amber, churn:S.blue, intent:S.dim };
  const entries = Object.entries(d.by_driver);
  return (
    <div style={card()}>
      <h3 style={{ fontSize:'1rem' }}>Why carts are lost</h3>
      <p style={{ color:S.dim, fontSize:'0.76rem', marginTop:6, marginBottom:18, lineHeight:1.6 }}>
        Ground truth the simulation has and a live system never does. Only
        <strong style={{ color:S.green }}> price-driven </strong>
        losses can be moved by a discount — the rest cannot, whatever its size.
      </p>
      {entries.map(([k, v]) => (
        <div key={k} style={{ marginBottom:13 }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:5,
                        fontSize:'0.82rem' }}>
            <span style={{ color: k === 'price' ? S.green : '#E5E7EB' }}>{k}</span>
            <span style={{ ...mono, color:S.dim }}>{pct(v.share,1)} · {v.n}</span>
          </div>
          <div style={{ background:S.border, borderRadius:4, height:9, overflow:'hidden' }}>
            <div style={{ width:`${v.share*100}%`, height:'100%',
                          background: colors[k] || S.dim, borderRadius:4 }} />
          </div>
        </div>
      ))}
      <div style={{ borderTop:`1px solid ${S.border}`, marginTop:14, paddingTop:12 }}>
        <Stat label="recoverable ceiling" value={pct(d.recoverable_share,1)}
              sub="the most any discount could ever reach" color={S.green} />
      </div>
    </div>
  );
};


/* ─── nearest measured point in the precomputed sweep ─── */
const nearest = (rows, key, value) =>
  (rows || []).reduce((best, r) =>
    (best == null || Math.abs(r[key]-value) < Math.abs(best[key]-value)) ? r : best, null);

/* ─── the lab: change the offer, see what it does ─── */
const Lab = ({ grid, building }) => {
  const [discount, setDiscount] = useState(0.15);
  const [latency, setLatency]   = useState(0.5);
  const [job, setJob]           = useState(null);
  const [live, setLive]         = useState(null);
  const poll = useRef(null);

  const dRow = nearest(grid?.by_discount, 'discount', discount);
  const lRow = nearest(grid?.by_latency, 'latency', latency);
  /* The discount sweep is the one that moves margin; latency mostly changes how
     many offers land in time, so it is reported separately rather than blended. */
  const shown = live || dRow;

  useEffect(() => () => poll.current && clearInterval(poll.current), []);

  const runLive = () => {
    setLive(null);
    fetch('/recovery/counterfactual', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ discount, latency, sessions: 3000 }),
    }).then(r => r.json()).then(res => {
      if (!res.accepted) { setJob({ status:'refused', error:res.reason }); return; }
      setJob({ status:'running', job_id:res.job_id, elapsed:0 });
      poll.current = setInterval(() => {
        fetch(`/recovery/counterfactual/${res.job_id}`).then(r => r.json()).then(j => {
          setJob(j);
          if (j.status === 'done' || j.status === 'error') {
            clearInterval(poll.current);
            if (j.status === 'done' && j.result) {
              setLive({ ...j.result.test, margin:j.result.margin, measured:true });
            }
          }
        }).catch(()=>{});
      }, 1500);
    }).catch(() => setJob({ status:'error', error:'could not reach the gateway' }));
  };

  const Slider = ({ label, value, min, max, step, fmt, onChange, note }) => (
    <div style={{ flex:'1 1 220px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
        <span style={{ fontSize:'0.8rem' }}>{label}</span>
        <span style={{ ...mono, color:S.blue, fontSize:'0.85rem' }}>{fmt(value)}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
             onChange={e => { setLive(null); onChange(parseFloat(e.target.value)); }}
             style={{ width:'100%', accentColor:S.blue }} />
      <div style={{ color:S.dim, fontSize:'0.68rem', marginTop:3 }}>{note}</div>
    </div>
  );

  return (
    <div style={card()}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline',
                    flexWrap:'wrap', gap:8 }}>
        <h3 style={{ fontSize:'1rem' }}>Change the offer</h3>
        <span style={{ ...mono, fontSize:'0.7rem', color:S.dim }}>
          {live ? 'measured just now' : grid?.sessions_per_cell
            ? `precomputed · ${grid.sessions_per_cell.toLocaleString()} sessions per point`
            : building ? 'building the response curves…' : 'response curves pending'}
        </span>
      </div>

      <div style={{ display:'flex', gap:24, marginTop:16, flexWrap:'wrap' }}>
        <Slider label="discount" value={discount} min={0.05} max={0.50} step={0.05}
                fmt={v => `${(v*100).toFixed(0)}%`} onChange={setDiscount}
                note="how much comes off the basket" />
        <Slider label="dispatch latency" value={latency} min={0.5} max={6} step={0.5}
                fmt={v => `${v.toFixed(1)}s`} onChange={setLatency}
                note="delay before the offer lands" />
      </div>

      {shown ? (
        <div style={{ marginTop:20 }}>
          <div style={{ display:'flex', gap:26, flexWrap:'wrap' }}>
            <Stat label="effect" value={`${shown.delta>=0?'+':''}${pct(shown.delta)}`}
                  sub={`95% CI ${pct(shown.ci_low)} → ${pct(shown.ci_high)}`}
                  color={shown.significant ? S.green : S.amber} big />
            <Stat label="net margin" value={money(shown.margin?.net)}
                  sub={shown.margin?.margin_positive ? 'pays for itself' : 'loses money'}
                  color={shown.margin?.margin_positive ? S.green : S.red} big />
            <Stat label="offers landing late"
                  value={lRow && lRow.issued ? `${Math.round(100*lRow.missed/lRow.issued)}%` : '—'}
                  sub={`at ${latency.toFixed(1)}s dispatch`} color={S.dim} />
          </div>
          <CIBar low={shown.ci_low} high={shown.ci_high} delta={shown.delta} />
        </div>
      ) : (
        <div style={{ marginTop:18 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <span className="dot" style={{ width:8, height:8, borderRadius:'50%',
                                           background:S.blue, display:'inline-block' }} />
            <span style={{ fontSize:'0.82rem' }}>
              {building
                ? 'Measuring the response curves — a dozen experiments, back to back.'
                : 'Preparing the response curves…'}
            </span>
          </div>
          <div style={{ background:S.border, borderRadius:4, height:6, marginTop:12,
                        overflow:'hidden' }}>
            <div style={{ height:'100%', width:'35%', background:S.blue, opacity:0.5,
                          borderRadius:4, animation:'sweep 1.6s ease-in-out infinite' }} />
          </div>
          <p style={{ color:S.dim, fontSize:'0.74rem', marginTop:10 }}>
            The sliders fill in on their own when it lands. You can still measure a
            single offer below while it runs.
          </p>
        </div>
      )}

      <div style={{ display:'flex', gap:12, alignItems:'center', marginTop:18,
                    flexWrap:'wrap' }}>
        <button onClick={runLive} disabled={job?.status === 'running'}
                style={{ background: job?.status==='running' ? S.border : S.blue,
                         color: job?.status==='running' ? S.dim : '#0F0F0F',
                         border:'none', borderRadius:8, padding:'10px 18px',
                         fontSize:'0.84rem', fontWeight:600,
                         cursor: job?.status==='running' ? 'default' : 'pointer' }}>
          {job?.status === 'running' ? 'measuring…' : 'Measure this for real'}
        </button>
        {job?.status === 'running' && (
          <span style={{ ...mono, fontSize:'0.75rem', color:S.dim }}>
            running a fresh experiment · {job.elapsed_seconds ?? 0}s
          </span>
        )}
        {job?.status === 'refused' && (
          <span style={{ ...mono, fontSize:'0.75rem', color:S.amber }}>{job.error}</span>
        )}
        {job?.status === 'error' && (
          <span style={{ ...mono, fontSize:'0.75rem', color:S.red }}>{job.error}</span>
        )}
        {live && (
          <span style={{ ...mono, fontSize:'0.75rem', color:S.green }}>
            measured live · n={live.treat_n}/{live.control_n}
          </span>
        )}
      </div>
      <p style={{ color:S.dim, fontSize:'0.72rem', marginTop:12, lineHeight:1.6 }}>
        Every point here is a real experiment — arms randomised at flag time,
        thresholds calibrated on a held-out seed. Nothing is interpolated.
      </p>
    </div>
  );
};

/* ─── where the programme stops paying for itself ─── */
const BreakEven = ({ grid, building }) => {
  const rows = grid?.by_discount;
  if (!rows?.length) return (
    <div style={card()}>
      <h3 style={{ fontSize:'1rem' }}>Where it stops paying for itself</h3>
      <p style={{ color:S.dim, fontSize:'0.78rem', marginTop:8, lineHeight:1.6 }}>
        {building
          ? 'Measuring net margin across discount rates. The crossing point appears here.'
          : 'Preparing the margin curve.'}
      </p>
    </div>
  );

  const W = 520, H = 220, P = { l:56, r:16, t:16, b:34 };
  const xs = rows.map(r => r.discount);
  const ys = rows.map(r => r.margin.net);
  const los = rows.map(r => r.margin_ci_low ?? r.margin.net);
  const his = rows.map(r => r.margin_ci_high ?? r.margin.net);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(0, ...los), yMax = Math.max(0, ...his);
  const x = v => P.l + ((v - xMin)/(xMax - xMin || 1)) * (W - P.l - P.r);
  const y = v => H - P.b - ((v - yMin)/((yMax - yMin) || 1)) * (H - P.t - P.b);
  const path = rows.map((r,i) => `${i?'L':'M'}${x(r.discount)},${y(r.margin.net)}`).join(' ');
  const be = grid.break_even_discount;

  return (
    <div style={card()}>
      <h3 style={{ fontSize:'1rem' }}>Where it stops paying for itself</h3>
      <p style={{ color:S.dim, fontSize:'0.76rem', marginTop:6, marginBottom:12,
                  lineHeight:1.6 }}>
        Net margin against discount rate, with 95% intervals. A bigger offer
        recovers more carts and costs more on every conversion it touches —
        including the ones that never needed it. Grey points are those whose
        sign the measurement does not resolve.
      </p>
      <div style={{ overflowX:'auto' }}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', minWidth:420 }}>
          <line x1={P.l} x2={W-P.r} y1={y(0)} y2={y(0)}
                stroke={S.dim} strokeWidth="1" strokeDasharray="4 4" opacity="0.6" />
          <text x={P.l-8} y={y(0)+4} textAnchor="end" fill={S.dim}
                style={{ ...mono, fontSize:10 }}>0</text>
          {be != null && (
            <g>
              <line x1={x(be)} x2={x(be)} y1={P.t} y2={H-P.b}
                    stroke={S.amber} strokeWidth="1.5" strokeDasharray="3 3" />
              <text x={x(be)} y={P.t+12} textAnchor="middle" fill={S.amber}
                    style={{ ...mono, fontSize:11 }}>{(be*100).toFixed(0)}%</text>
            </g>
          )}
          {/* 95% interval on net margin. Margin depends on the rate difference
            and on what the recovered baskets were worth, so it varies far more
            than the rate; drawing only the line would imply precision the
            measurement does not have. */}
        <path d={
          rows.map((r,i) => `${i?'L':'M'}${x(r.discount)},${y(r.margin_ci_high ?? r.margin.net)}`).join(' ')
          + ' ' +
          rows.slice().reverse().map(r => `L${x(r.discount)},${y(r.margin_ci_low ?? r.margin.net)}`).join(' ')
          + ' Z'
        } fill={S.green} opacity="0.13" stroke="none" />
        <path d={path} fill="none" stroke={S.green} strokeWidth="2.5"
                strokeLinejoin="round" />
          {rows.map(r => (
            <circle key={r.discount} cx={x(r.discount)} cy={y(r.margin.net)} r="3.5"
                    fill={r.margin_sign_resolved === false ? S.dim
                          : r.margin.net >= 0 ? S.green : S.red} />
          ))}
          {rows.map(r => (
            <text key={`x${r.discount}`} x={x(r.discount)} y={H-P.b+16}
                  textAnchor="middle" fill={S.dim} style={{ ...mono, fontSize:10 }}>
              {(r.discount*100).toFixed(0)}%
            </text>
          ))}
          <text x={P.l-8} y={y(yMax)+4} textAnchor="end" fill={S.dim}
                style={{ ...mono, fontSize:10 }}>{Math.round(yMax).toLocaleString()}</text>
          <text x={P.l-8} y={y(yMin)+4} textAnchor="end" fill={S.dim}
                style={{ ...mono, fontSize:10 }}>{Math.round(yMin).toLocaleString()}</text>
        </svg>
      </div>
      {be != null ? (
        <p style={{ fontSize:'0.82rem', marginTop:8 }}>
          Break-even at <strong style={{ color:S.amber }}>{(be*100).toFixed(1)}%</strong>.
          Beyond it the programme still recovers carts and still loses money.
        </p>
      ) : (
        <p style={{ color:S.dim, fontSize:'0.8rem', marginTop:8, lineHeight:1.6 }}>
          <strong style={{ color:S.amber }}>Break-even is not established.</strong> Net
          margin trends down as the discount rises, but at this sample size most
          points have a 95% interval straddling zero (grey), so the crossing
          cannot be located without more sessions per point. Saying where it
          falls would be reading sampling error.
        </p>
      )}
    </div>
  );
};

/* ─── audit trail ─── */
const Audit = ({ decisions, onPick, picked }) => (
  <div style={card({ padding:0, overflow:'hidden' })}>
    <div style={{ padding:'18px 20px 12px' }}>
      <h3 style={{ fontSize:'1rem' }}>Audit trail</h3>
      <p style={{ color:S.dim, fontSize:'0.76rem', marginTop:6 }}>
        Append-only. Click a row to see why it was flagged.
      </p>
    </div>
    <div style={{ maxHeight:360, overflowY:'auto' }}>
      <table style={{ width:'100%', borderCollapse:'collapse', ...mono, fontSize:'0.74rem' }}>
        <thead>
          <tr style={{ color:S.dim, textAlign:'left', position:'sticky', top:0,
                       background:S.card }}>
            {['session','arm','trigger','cart','outcome'].map(h => (
              <th key={h} style={{ padding:'8px 12px', borderBottom:`1px solid ${S.border}`,
                                   fontWeight:500 }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {decisions.map(d => (
            <tr key={d.session_id} className="row-in" onClick={() => onPick(d.session_id)}
                style={{ cursor:'pointer',
                         background: picked === d.session_id ? '#1E1E1E' : 'transparent' }}>
              <td style={{ padding:'7px 12px', borderBottom:`1px solid ${S.border}` }}>
                {d.session_id}</td>
              <td style={{ padding:'7px 12px', borderBottom:`1px solid ${S.border}`,
                           color: d.arm === 'treatment' ? S.green : S.dim }}>
                {d.arm}{d.arm === 'treatment' && !d.landed ? ' (missed)' : ''}</td>
              <td style={{ padding:'7px 12px', borderBottom:`1px solid ${S.border}`,
                           color:S.blue }}>{d.trigger}</td>
              <td style={{ padding:'7px 12px', borderBottom:`1px solid ${S.border}` }}>
                {money(d.cart_value)}</td>
              <td style={{ padding:'7px 12px', borderBottom:`1px solid ${S.border}`,
                           color: d.outcome === 'converted' ? S.green : S.red }}>
                {d.outcome === 'converted' ? 'converted' : d.reason_code}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  </div>
);

/* ─── explain one decision ─── */
const Explain = ({ detail }) => {
  if (!detail) return (
    <div style={card()}>
      <h3 style={{ fontSize:'1rem' }}>Why did this shopper get an offer?</h3>
      <p style={{ color:S.dim, fontSize:'0.8rem', marginTop:10 }}>
        Pick a row from the audit trail. The same answer is available to an agent
        over MCP via <code style={{ ...mono, color:S.blue }}>explain_decision</code>.
      </p>
    </div>
  );
  if (!detail.found) return <div style={card()}><p style={{color:S.dim}}>{detail.message}</p></div>;
  const ev = detail.why_flagged.evidence;
  return (
    <div style={card()}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
        <h3 style={{ fontSize:'1rem' }}>Why this shopper was flagged</h3>
        <span style={{ ...mono, fontSize:'0.72rem', color:S.blue }}>{detail.session_id}</span>
      </div>
      <div style={{ marginTop:14, display:'grid',
                    gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))', gap:14 }}>
        <Stat label="trigger"  value={detail.why_flagged.trigger} color={S.blue} />
        <Stat label="arm"      value={detail.arm}
              color={detail.arm === 'treatment' ? S.green : S.dim} />
        <Stat label="outcome"  value={detail.outcome}
              color={detail.outcome === 'converted' ? S.green : S.red} />
        <Stat label="cause"    value={detail.quit_driver || '—'}
              color={detail.was_recoverable ? S.green : S.dim} />
      </div>
      <div style={{ marginTop:18 }}>
        <div style={{ color:S.dim, fontSize:'0.72rem', textTransform:'uppercase',
                      letterSpacing:'0.06em', marginBottom:8 }}>
          evidence the detector saw
        </div>
        <div style={{ ...mono, fontSize:'0.74rem', background:'#101010',
                      border:`1px solid ${S.border}`, borderRadius:8, padding:12,
                      display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',
                      gap:'6px 16px' }}>
          {Object.entries(ev).map(([k,v]) => (
            <div key={k} style={{ display:'flex', justifyContent:'space-between' }}>
              <span style={{ color:S.dim }}>{k}</span>
              <span>{typeof v === 'number' ? v.toFixed(2) : String(v)}</span>
            </div>
          ))}
        </div>
      </div>
      <Timeline detail={detail} />
      <div style={{ marginTop:16, fontSize:'0.8rem', lineHeight:1.7 }}>
        <div><span style={{ color:S.dim }}>offer: </span>{detail.offer}</div>
        <div><span style={{ color:S.dim }}>idempotency key: </span>
          <span style={mono}>{detail.idempotency_key || '—'}</span></div>
        <div><span style={{ color:S.dim }}>detector: </span>
          <span style={mono}>{detail.detector_version}</span></div>
      </div>
    </div>
  );
};


/* ─── one session, as it happened ─── */
const Timeline = ({ detail }) => {
  if (!detail?.found || detail.ended_at_sim == null) return null;
  const end = detail.ended_at_sim || 1;
  const marks = [
    { t: 0, label: 'session starts', color: S.dim },
    { t: detail.flagged_at_sim, label: 'flagged at risk', color: S.amber },
    detail.arm === 'treatment' && detail.dispatched_at_sim != null
      ? { t: detail.dispatched_at_sim, label: 'offer sent', color: S.blue } : null,
    detail.applied_at_sim != null
      ? { t: detail.applied_at_sim, label: 'offer lands', color: S.purple } : null,
    { t: end, label: detail.outcome === 'converted' ? 'converted' : detail.reason_code,
      color: detail.outcome === 'converted' ? S.green : S.red },
  ].filter(Boolean).filter(m => m.t != null);

  const x = t => Math.min(100, Math.max(0, (t/end) * 100));
  return (
    <div style={{ marginTop:20 }}>
      <div style={{ color:S.dim, fontSize:'0.72rem', textTransform:'uppercase',
                    letterSpacing:'0.06em', marginBottom:12 }}>
        what happened, in simulated seconds
      </div>
      <div style={{ position:'relative', height:8, background:S.border,
                    borderRadius:4, marginBottom:8 }}>
        {detail.applied_at_sim != null && (
          <div style={{ position:'absolute', left:`${x(detail.applied_at_sim)}%`,
                        right:0, top:0, bottom:0, background:S.purple,
                        opacity:0.25, borderRadius:4 }} />
        )}
        {marks.map((m,i) => (
          <div key={i} style={{ position:'absolute', left:`${x(m.t)}%`, top:-4,
                                width:3, height:16, background:m.color,
                                borderRadius:2 }} />
        ))}
      </div>
      <div style={{ display:'grid',
                    gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',
                    gap:'6px 12px', ...mono, fontSize:'0.7rem' }}>
        {marks.map((m,i) => (
          <div key={i} style={{ display:'flex', gap:6, alignItems:'baseline' }}>
            <span style={{ width:7, height:7, borderRadius:2, background:m.color,
                           display:'inline-block' }} />
            <span style={{ color:S.dim }}>{m.t.toFixed(1)}s</span>
            <span>{m.label}</span>
          </div>
        ))}
      </div>
      {detail.arm === 'treatment' && detail.applied_at_sim == null && (
        <p style={{ color:S.amber, fontSize:'0.74rem', marginTop:10 }}>
          The offer was sent but never landed — the session ended first. Dispatch
          latency is a real constraint, not an assumption.
        </p>
      )}
    </div>
  );
};

/* ─── the funnel, live ─── */
const Funnel = ({ stats }) => {
  const started = stats.sessions_started || 0;
  if (!started) return null;
  const carted = stats.sessions_reached_cart || 0;
  const converted = stats.sessions_converted || 0;
  const steps = [
    { label:'sessions started', n:started, color:S.dim },
    { label:'reached a cart',   n:carted,  color:S.amber },
    { label:'converted',        n:converted, color:S.green },
  ];
  return (
    <div style={card()}>
      <div style={{ display:'flex', justifyContent:'space-between',
                    alignItems:'baseline' }}>
        <h3 style={{ fontSize:'1rem' }}>The funnel, right now</h3>
        <span style={{ ...mono, fontSize:'0.7rem', color:S.dim }}>
          {stats.rounds ? `round ${stats.rounds}` : ''}
        </span>
      </div>
      <p style={{ color:S.dim, fontSize:'0.76rem', marginTop:6, marginBottom:16 }}>
        Cart abandonment is measured over the middle bar, not the first — which is
        what makes it comparable to the published figure.
      </p>
      {steps.map((step,i) => (
        <div key={step.label} style={{ marginBottom:13 }}>
          <div style={{ display:'flex', justifyContent:'space-between',
                        marginBottom:5, fontSize:'0.82rem' }}>
            <span>{step.label}</span>
            <span style={{ ...mono, color:step.color }}>
              {step.n.toLocaleString()}
              {i > 0 && steps[i-1].n
                ? <span style={{ color:S.dim }}> · {pct(step.n/steps[i-1].n,1)} of above</span>
                : null}
            </span>
          </div>
          <div style={{ background:S.border, borderRadius:4, height:11,
                        overflow:'hidden' }}>
            <div style={{ width:`${(step.n/started)*100}%`, height:'100%',
                          background:step.color, borderRadius:4, opacity:0.85,
                          transition:'width .4s ease' }} />
          </div>
        </div>
      ))}
      {stats.cart_abandonment_rate != null && (
        <div style={{ borderTop:`1px solid ${S.border}`, marginTop:14, paddingTop:12 }}>
          <Stat label="cart abandonment (live)"
                value={pct(stats.cart_abandonment_rate,1)}
                sub="over sessions that built a cart" color={S.red} />
        </div>
      )}
    </div>
  );
};

/* ─── live feed ─── */
const Live = ({ events, stats }) => (
  <div style={card({ padding:0, overflow:'hidden' })}>
    <div style={{ padding:'18px 20px 12px', display:'flex',
                  justifyContent:'space-between', alignItems:'baseline' }}>
      <h3 style={{ fontSize:'1rem' }}>Live simulation</h3>
      <span style={{ ...mono, fontSize:'0.7rem', color:S.dim }}>
        {stats.sessions_started ? `${stats.sessions_started} sessions` : ''}
        {stats.cart_abandonment_rate != null
          ? ` · cart abandonment ${pct(stats.cart_abandonment_rate,1)}` : ''}
      </span>
    </div>
    <div style={{ maxHeight:300, overflowY:'auto' }}>
      <table style={{ width:'100%', borderCollapse:'collapse', ...mono, fontSize:'0.72rem' }}>
        <tbody>
          {events.slice(0,40).map((e,i) => (
            <tr key={`${e.session_id}-${e.sim_time}-${i}`} className="row-in">
              <td style={{ padding:'6px 12px', color:S.dim, borderBottom:`1px solid ${S.border}` }}>
                {e.time}</td>
              <td style={{ padding:'6px 12px', borderBottom:`1px solid ${S.border}` }}>
                #{e.agent_id}</td>
              <td style={{ padding:'6px 12px', borderBottom:`1px solid ${S.border}`,
                           color: e.action === 'checkout' ? S.green
                                : e.action === 'cart' ? S.amber : S.dim }}>
                {e.action}</td>
              <td style={{ padding:'6px 12px', borderBottom:`1px solid ${S.border}`,
                           color:S.dim }}>{e.product}</td>
              <td style={{ padding:'6px 12px', borderBottom:`1px solid ${S.border}`,
                           textAlign:'right' }}>
                {e.cart_value ? money(e.cart_value) : ''}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  </div>
);

/* ─── app ─── */
const App = () => {
  const [ab, setAb] = useState(null);
  const [aa, setAa] = useState(null);
  const [drivers, setDrivers] = useState(null);
  const [decisions, setDecisions] = useState([]);
  const [picked, setPicked] = useState(null);
  const [detail, setDetail] = useState(null);
  const [events, setEvents] = useState([]);
  const [stats, setStats] = useState({});
  const [live, setLive] = useState(false);
  const [grid, setGrid] = useState(null);
  const [building, setBuilding] = useState(false);
  const [rob, setRob] = useState(null);

  useEffect(() => {
    const j = (u) => fetch(u).then(r => r.json()).catch(() => null);
    j('/recovery/robustness').then(r => setRob(r && r.available === false ? null : r));
    j('/recovery/experiments').then(list => {
      if (!list?.experiments?.length) return;
      const abId = (list.experiments.find(e => e.experiment_id.startsWith('ab-'))
                    || list.experiments[0]).experiment_id;
      const aaId = (list.experiments.find(e => e.experiment_id.startsWith('aa-')) || {}).experiment_id;
      j(`/recovery/experiment?experiment_id=${abId}`).then(setAb);
      j(`/recovery/drivers?experiment_id=${abId}`).then(setDrivers);
      j(`/recovery/decisions?experiment_id=${abId}&limit=60`)
        .then(d => setDecisions(d?.decisions || []));
      if (aaId) j(`/recovery/experiment?experiment_id=${aaId}`).then(setAa);
    });
  }, []);

  /* The server builds the sweep itself if it is missing; poll until it lands. */
  useEffect(() => {
    let timer = null;
    const check = () => fetch('/recovery/grid').then(r => r.json()).then(g => {
      if (g && g.available === false) {
        setBuilding(g.status === 'building');
        timer = setTimeout(check, 8000);
      } else {
        setGrid(g);
        setBuilding(false);
      }
    }).catch(() => { timer = setTimeout(check, 15000); });
    check();
    return () => timer && clearTimeout(timer);
  }, []);

  useEffect(() => {
    if (!picked) return;
    fetch(`/recovery/decision/${picked}`).then(r => r.json()).then(setDetail).catch(()=>{});
  }, [picked]);

  useEffect(() => {
    let ws;
    try {
      ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/live`);
      ws.onmessage = (m) => {
        const p = JSON.parse(m.data);
        if (p.events) setEvents(p.events);
        if (p.stats)  setStats(p.stats);
        setLive(p.status === 'running');
      };
      ws.onclose = () => setLive(false);
    } catch (_) { setLive(false); }
    return () => ws && ws.close();
  }, []);

  return (
    <div style={{ maxWidth:1240, margin:'0 auto', padding:'32px 24px 64px' }}>
      <Header live={live} />
      <div style={{ display:'grid', gap:20 }}>
        <Result ab={ab} aa={aa} rob={rob} />
        <Lab grid={grid} building={building} />
        <div style={{ display:'grid', gap:20, gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))' }}>
          <BreakEven grid={grid} building={building} />
          <Margin ab={ab} />
        </div>
        <Drivers d={drivers} />
        <div style={{ display:'grid', gap:20, gridTemplateColumns:'repeat(auto-fit,minmax(340px,1fr))' }}>
          <Audit decisions={decisions} onPick={setPicked} picked={picked} />
          <Explain detail={detail} />
        </div>
        <div style={{ display:'grid', gap:20, gridTemplateColumns:'repeat(auto-fit,minmax(340px,1fr))' }}>
          <Funnel stats={stats} />
          <Live events={events} stats={stats} />
        </div>
      </div>
      <p style={{ color:S.dim, fontSize:'0.72rem', textAlign:'center', marginTop:32,
                  ...mono, lineHeight:1.8 }}>
        Synthetic order values · behavioural model calibrated to published aggregate benchmarks<br/>
        The method transfers; the magnitudes are not a prediction about live traffic
      </p>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
